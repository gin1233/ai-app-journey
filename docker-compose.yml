services:
  db:
    image: postgres:17
    container_name: aiapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiapp
      POSTGRES_PASSWORD: aiapp_dev_pw
      POSTGRES_DB: aiapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: