<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>流式输出演示</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; font-size: 15px; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 20px; font-size: 15px; margin: 8px 0; cursor: pointer; }
  #out { white-space: pre-wrap; border: 1px solid #ddd; border-radius: 6px;
         padding: 12px; min-height: 120px; background: #fafafa; line-height: 1.7; }
</style>
</head>
<body>
  <h2>流式输出演示</h2>
  <textarea id="input" rows="3">用五句话介绍 Python</textarea>
  <button id="btn">发送</button>
  <div id="out"></div>
  <hr style="margin: 32px 0">
  <h2>AI 总结笔记</h2>
  <input id="noteId" type="number" value="2" min="1">
  <button id="sumBtn">总结</button>
  <div id="sumOut" style="white-space: pre-wrap; border: 1px solid #ddd; border-radius: 6px;
  padding: 12px; min-height: 80px; background: #fafafa; line-height: 1.7;"></div>
<script>
/** 发一个请求，把 SSE 流里的文字一段段交给 onPiece 处理。 */
async function readSSE(url, body, onPiece) {
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    onPiece(`\n[错误 ${resp.status}] ${err.detail ?? "未知错误"}`);
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const payload = line.slice(6);
      if (payload === "[DONE]") return;
      onPiece(JSON.parse(payload));
    }
  }
}

// ---- 对话 ----
const out = document.getElementById("out");
const btn = document.getElementById("btn");

btn.onclick = async () => {
  out.textContent = "";
  btn.disabled = true;
  await readSSE("/ai/chat/stream",
    { prompt: document.getElementById("input").value },
    s => { out.textContent += s; });
  btn.disabled = false;
};

// ---- 总结笔记 ----
const sumOut = document.getElementById("sumOut");
const sumBtn = document.getElementById("sumBtn");

sumBtn.onclick = async () => {
  sumOut.textContent = "";
  sumBtn.disabled = true;
  const id = document.getElementById("noteId").value;
  await readSSE(`/notes/${id}/summarize`, {},
    s => { sumOut.textContent += s; });
  sumBtn.disabled = false;
};
</script>
</body>
</html>
